<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>电动车远程控制器【WSS公网版】</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{padding:20px;margin:0;background:#f5f5f5}
.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px #00000014;max-width:900px;margin:0 auto}
.btn{width:100%;padding:18px;margin:10px 0;border:none;border-radius:8px;font-size:22px;color:#fff;cursor:pointer}
.btn-on{background:#28b956}
.btn-off{background:#e53935}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.status-bar{padding:12px;border-radius:8px;margin-bottom:16px;background:#ddd;font-size:18px}
.dev-status{padding:12px;border-radius:8px;margin-bottom:16px;background:#e8f4ff;font-size:18px}
.gps-box{padding:12px;border-radius:8px;margin-bottom:16px;background:#eee;font-size:18px}
.log-box{height:160px;overflow-y:auto;padding:12px;background:#000;color:#39ff14;border-radius:8px;margin-top:10px;font-family:monospace;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h2>电动车远程控制(带密码+状态回传 公网WSS)</h2>
  <div id="mqttStatus" class="status-bar">MQTT状态：连接中...</div>
  <div id="devState" class="dev-status">电动车状态：未知(等待设备上报)</div>
  <div id="gpsInfo" class="gps-box">等待GPS位置上报...</div>
  <button id="btnStart" class="btn btn-on" onclick="sendCmd('ON')">启动电动车</button>
  <button id="btnStop" class="btn btn-off" onclick="sendCmd('OFF')">关闭电动车</button>
  <div>操作日志:</div>
  <div id="logBox" class="log-box"></div>
</div>
<script>
// ============ 配置区，必须和ESP代码保持一致 ============
const PASSWORD = "PASS123456";
const subTopicGps = "ev/gps";
const subTopicState = "ev/state";
const pubTopicCmd = "ev/cmd";
const MQTT_WSS_URL = "wss://broker.emqx.io:8884/mqtt";
let client = null;
let isReconnecting = false;
// ========================================================
const mqttStatusDom = document.getElementById("mqttStatus");
const devStateDom = document.getElementById("devState");
const gpsInfoDom = document.getElementById("gpsInfo");
const logBoxDom = document.getElementById("logBox");
const btnStart = document.getElementById("btnStart");
const btnStop = document.getElementById("btnStop");

// 日志输出函数
function addLog(text){
  const time = new Date().toLocaleTimeString();
  logBoxDom.innerHTML += `[${time}] ${text}\n`;
  logBoxDom.scrollTop = logBoxDom.scrollHeight;
}

// 创建MQTT客户端
function connectMqtt(){
  if(client){
    client.end(true); // 强制销毁旧连接
    client = null;
  }
  const clientId = "web_ev_" + Math.random().toString(36).slice(2);
  client = mqtt.connect(MQTT_WSS_URL,{
    clientId: clientId,
    reconnectPeriod: 5000,  // 拉长重连间隔，避免频繁连接被服务器封禁
    connectTimeout: 8000
  });

  // 连接成功回调
  client.on('connect',()=>{
    isReconnecting = false;
    mqttStatusDom.innerText = "MQTT状态：✅已连接(WSS)";
    addLog("MQTT服务器连接成功(WSS)");
    //订阅GPS和设备状态主题
    client.subscribe(subTopicGps);
    client.subscribe(subTopicState);
    btnStart.disabled = false;
    btnStop.disabled = false;
  });

  // 连接断开回调
  client.on('close',()=>{
    mqttStatusDom.innerText = "MQTT状态：❌连接断开";
    addLog("MQTT连接断开");
    devStateDom.innerText = "电动车状态：未知，连接断开";
    btnStart.disabled = true;
    btnStop.disabled = true;
    if(!isReconnecting){
      isReconnecting = true;
      addLog("等待5s后尝试重连...");
      setTimeout(connectMqtt,5000);
    }
  });

  // 错误回调
  client.on('error',(err)=>{
    addLog("MQTT错误:" + err.message);
  });

  // 收到MQTT消息
  client.on('message',(topic,payload)=>{
    const msg = payload.toString();
    if(topic === subTopicGps){
      gpsInfoDom.innerText = "GPS位置：" + msg;
      addLog("收到GPS数据:" + msg);
    }else if(topic === subTopicState){
      if(msg === "ON"){
        devStateDom.innerText = "电动车状态：✅已启动";
      }else if(msg === "OFF"){
        devStateDom.innerText = "电动车状态：❌已关闭";
      }
      addLog("收到设备状态:" + msg);
    }
  });
}

// 下发控制指令
function sendCmd(cmd){
  if(!client || !client.connected){
    alert("MQTT未连接，无法发送指令");
    return;
  }
  const payload = PASSWORD + ":" + cmd;
  client.publish(pubTopicCmd, payload);
  addLog("下发指令: " + cmd);
}

// 页面加载完成启动连接
window.onload = function(){
  connectMqtt();
}
</script>
</body>
</html>
