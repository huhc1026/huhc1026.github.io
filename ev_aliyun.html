<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>电动车远程控制器【带密码】</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{padding:20px;margin:0;background:#f5f5f5}
.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px #00000014;max-width:900px;margin:0 auto}
.btn{width:100%;padding:18px;margin:10px 0;border:none;border-radius:8px;font-size:22px;color:white;cursor:pointer}
.btn-on{background:#34b950}
.btn-off{background:#e54545}
.btn:disabled{background:#888;cursor:not-allowed}
.status-bar{padding:12px;border-radius:8px;margin-bottom:12px;background:#ddd;font-size:18px}
.gps-box{padding:14px;background:#eee;border-radius:8px;margin:12px 0;font-size:16px}
.dev-state{padding:14px;background:#e8f4ff;border-radius:8px;margin:12px 0;font-size:16px}
.log-box{height:160px;overflow-y:auto;padding:12px;background:#222;color:#0f0;border-radius:8px;margin-top:16px;font-family:monospace;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h2>电动车远程控制(带密码+状态回传)</h2>
  <div id="mqttStatus" class="status-bar">MQTT状态：连接中...</div>
  <div id="devState" class="dev-state">电动车状态：未知(等待设备上报)</div>
  <div id="gpsInfo" class="gps-box">等待GPS位置上报...</div>
  <button id="btnStart" class="btn btn-on" onclick="sendCmd('ON')">启动电动车</button>
  <button id="btnStop" class="btn btn-off" onclick="sendCmd('OFF')">关闭电动车</button>
  <div>操作日志：</div>
  <div id="logBox" class="log-box"></div>
</div>
<script>
// ============ 配置区，必须和ESP代码完全一致 ============
const PASSWORD = "PASS123456";
const subTopic_gps = "ev/gps";        //ESP上报GPS
const subTopic_state = "ev/state";    //ESP上报电动车继电器状态
const pubTopic_cmd = "ev/cmd";        //网页下发控制指令
const clientId = "web_ev_"+Math.random().toString(36).slice(2);

// 重要：ws 8083，只支持http协议打开，不能file://本地双击打开
const client = mqtt.connect(`ws://broker.emqx.io:8083/mqtt`,{
  clientId: clientId,
  reconnectPeriod: 3000
});
// ========================================================
const mqttStatusDom = document.getElementById("mqttStatus");
const devStateDom = document.getElementById("devState");
const gpsInfoDom = document.getElementById("gpsInfo");
const logBoxDom = document.getElementById("logBox");
const btnStart = document.getElementById("btnStart");
const btnStop = document.getElementById("btnStop");

//日志追加函数
function addLog(text){
  const time = new Date().toLocaleTimeString();
  logBoxDom.innerHTML += `[${time}] ${text}\n`;
  logBoxDom.scrollTop = logBoxDom.scrollHeight;
}

client.on('connect',()=>{
  mqttStatusDom.innerText = "MQTT状态：✅已连接";
  addLog("MQTT服务器连接成功");
  //订阅两个主题：GPS + 设备状态
  client.subscribe(subTopic_gps);
  client.subscribe(subTopic_state);
  btnStart.disabled = false;
  btnStop.disabled = false;
})

client.on('close',()=>{
  mqttStatusDom.innerText = "MQTT状态：❌连接断开";
  addLog("MQTT连接断开");
  devStateDom.innerText = "电动车状态：未知，连接断开";
  btnStart.disabled = true;
  btnStop.disabled = true;
})

client.on('error',(err)=>{
  addLog("MQTT错误:" + err);
})

//接收MQTT消息
client.on('message',(topic,payload)=>{
  const msg = payload.toString();
  if(topic === subTopic_gps){
    gpsInfoDom.innerText = "GPS位置："+msg;
    addLog("收到GPS："+msg);
  }else if(topic === subTopic_state){
    //ESP上报设备运行状态
    if(msg === "ON"){
      devStateDom.innerText = "电动车状态：✅已启动";
    }else if(msg === "OFF"){
      devStateDom.innerText = "电动车状态：❌已关闭";
    }
    addLog("设备上报状态："+msg);
  }
})

//下发控制指令
function sendCmd(cmd){
  if(!client.connected){
    alert("MQTT未连接，指令发送失败");
    return;
  }
  const fullMsg = PASSWORD + ":" + cmd;
  client.publish(pubTopic_cmd, fullMsg);
  addLog("下发指令："+cmd);
}
</script>
</body>
</html>
